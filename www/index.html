<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" black-translucent">
    <meta name="theme-color" content="#ffffff">
    <title>环境音效制造器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar (desktop) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fa-solid fa-headphones"></i>
                    </div>
                    <span class="logo-text">环境音效制造器</span>
                </div>
            </div>

            <nav class="sidebar-nav" id="sidebarNav">
                <button class="nav-item active" data-category="all">
                    <i class="fa-solid fa-border-all"></i>
                    <span>全部</span>
                </button>
                <button class="nav-item" data-category="favorites">
                    <i class="fa-solid fa-star"></i>
                    <span>收藏</span>
                </button>
                <div class="nav-divider"></div>
                <button class="nav-item" data-category="rain">
                    <i class="fa-solid fa-cloud-rain"></i>
                    <span>雨声</span>
                </button>
                <button class="nav-item" data-category="nature">
                    <i class="fa-solid fa-leaf"></i>
                    <span>自然</span>
                </button>
                <button class="nav-item" data-category="urban">
                    <i class="fa-solid fa-city"></i>
                    <span>城市</span>
                </button>
                <button class="nav-item" data-category="transport">
                    <i class="fa-solid fa-plane"></i>
                    <span>交通</span>
                </button>
                <button class="nav-item" data-category="places">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>场所</span>
                </button>
                <button class="nav-item" data-category="animals">
                    <i class="fa-solid fa-paw"></i>
                    <span>动物</span>
                </button>
                <button class="nav-item" data-category="noise">
                    <i class="fa-solid fa-wave-square"></i>
                    <span>噪音</span>
                </button>
                <button class="nav-item" data-category="things">
                    <i class="fa-solid fa-shapes"></i>
                    <span>物件</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <button class="nav-item" id="sidebarTimer">
                    <i class="fa-solid fa-moon"></i>
                    <span>睡眠定时</span>
                </button>
                <button class="nav-item" id="sidebarPresets">
                    <i class="fa-solid fa-bookmark"></i>
                    <span>已保存混音</span>
                </button>
            </div>
        </aside>

        <!-- Main Area -->
        <div class="main-area">
            <!-- Top Bar -->
            <header class="topbar">
                <!-- Mobile: hamburger + title -->
                <button class="topbar-menu" id="menuToggle">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <!-- Mobile: horizontal category pills -->
                <div class="pills-scroll" id="mobilePills">
                    <button class="pill active" data-category="all">全部</button>
                    <button class="pill" data-category="favorites"><i class="fa-solid fa-star"></i></button>
                    <button class="pill" data-category="rain">雨声</button>
                    <button class="pill" data-category="nature">自然</button>
                    <button class="pill" data-category="urban">城市</button>
                    <button class="pill" data-category="transport">交通</button>
                    <button class="pill" data-category="places">场所</button>
                    <button class="pill" data-category="animals">动物</button>
                    <button class="pill" data-category="noise">噪音</button>
                    <button class="pill" data-category="things">物件</button>
                </div>

                <!-- Desktop: section title + actions -->
                <div class="topbar-desktop">
                    <h1 class="section-title" id="sectionTitle">全部声音</h1>
                    <div class="topbar-actions">
                        <button class="topbar-btn" id="topbarTimer" title="睡眠定时">
                            <i class="fa-solid fa-moon"></i>
                        </button>
                        <button class="topbar-btn" id="topbarPresets" title="已保存混音">
                            <i class="fa-solid fa-folder-open"></i>
                        </button>
                        <button class="topbar-btn" id="topbarSave" title="保存混音">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                        <button class="topbar-btn" id="topbarTheme" title="切换主题">
                            <i class="fa-solid fa-circle-half-stroke"></i>
                        </button>
                    </div>
                </div>

                <!-- Mobile: actions -->
                <div class="topbar-mobile-actions">
                    <button class="topbar-btn" id="mobileTimer" title="睡眠定时">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                    <button class="topbar-btn" id="mobilePresets" title="已保存混音">
                        <i class="fa-solid fa-folder-open"></i>
                    </button>
                    <button class="topbar-btn" id="mobileTheme">
                        <i class="fa-solid fa-circle-half-stroke"></i>
                    </button>
                </div>
            </header>

            <!-- Quick Presets -->
            <div class="quick-presets" id="quickPresets">
                <div class="quick-presets-label">快速启动</div>
                <div class="quick-presets-list" id="quickPresetsList"></div>
            </div>

            <!-- Sound Grid -->
            <section class="grid-area">
                <div class="sound-grid" id="soundGrid"></div>
            </section>
        </div>
    </div>

    <!-- Now Playing Floating Bar -->
    <div class="now-playing hidden" id="nowPlaying" role="button" tabindex="0">
        <div class="np-left">
            <div class="np-indicator">
                <span class="np-dot"></span>
            </div>
            <div class="np-info">
                <span class="np-label">正在播放</span>
                <div class="np-chips" id="npChips"></div>
            </div>
            <div class="np-timer hidden" id="npTimer">
                <i class="fa-solid fa-moon"></i>
                <span id="npTimerValue">00:00</span>
            </div>
        </div>
        <div class="np-actions">
            <button class="np-stop" id="npStop" title="全部停止">
                <i class="fa-solid fa-stop"></i>
            </button>
        </div>
    </div>

    <!-- Expanded Player Panel -->
    <div class="player-panel hidden" id="playerPanel">
        <div class="player-panel-header">
            <span class="player-panel-title">正在播放</span>
            <button class="player-panel-close" id="playerPanelClose">
                <i class="fa-solid fa-chevron-down"></i>
            </button>
        </div>
        <div class="player-panel-body" id="playerPanelBody"></div>
    </div>

    <!-- Sleep Timer Sheet -->
    <div class="sheet-overlay hidden" id="timerOverlay"></div>
    <div class="sheet hidden" id="timerSheet">
        <div class="sheet-handle"></div>
        <h3 class="sheet-title">睡眠定时器</h3>
        <div class="timer-grid" id="timerGrid">
            <button class="timer-option" data-minutes="15">15 分钟</button>
            <button class="timer-option" data-minutes="30">30 分钟</button>
            <button class="timer-option" data-minutes="45">45 分钟</button>
            <button class="timer-option" data-minutes="60">1 小时</button>
            <button class="timer-option" data-minutes="90">1.5 小时</button>
            <button class="timer-option" data-minutes="120">2 小时</button>
        </div>
        <div class="timer-custom-row">
            <input type="number" id="customTimerInput" min="1" max="480" placeholder="自定义分钟数" class="timer-input">
            <button class="timer-set-btn" id="setCustomTimer">设置</button>
        </div>
        <div class="timer-active-section hidden" id="timerActiveSection">
            <div class="timer-countdown">
                <span class="timer-remaining" id="timerRemaining">00:00</span>
            </div>
            <button class="timer-cancel-btn" id="cancelTimerBtn">取消定时器</button>
        </div>
    </div>

    <!-- Presets Sheet -->
    <div class="sheet-overlay hidden" id="presetsOverlay"></div>
    <div class="sheet hidden" id="presetsSheet">
        <div class="sheet-handle"></div>
        <h3 class="sheet-title">已保存的混音</h3>
        <div class="sheet-body" id="presetsList"></div>
    </div>

    <!-- Input Sheet (for naming presets) -->
    <div class="sheet-overlay hidden" id="inputOverlay"></div>
    <div class="sheet hidden" id="inputSheet">
        <div class="sheet-handle"></div>
        <h3 class="sheet-title" id="inputTitle">输入</h3>
        <div class="sheet-body">
            <input type="text" id="inputField" class="sheet-input" placeholder="">
            <div class="sheet-buttons">
                <button class="sheet-btn secondary" id="inputCancel">取消</button>
                <button class="sheet-btn primary" id="inputOk">好</button>
            </div>
        </div>
    </div>

    <!-- Message Sheet -->
    <div class="sheet-overlay hidden" id="messageOverlay"></div>
    <div class="sheet hidden" id="messageSheet">
        <div class="sheet-handle"></div>
        <h3 class="sheet-title" id="messageTitle">提示</h3>
        <div class="sheet-body">
            <p class="sheet-text" id="messageText"></p>
            <div class="sheet-buttons">
                <button class="sheet-btn primary full" id="messageOk">好</button>
            </div>
        </div>
    </div>

    <!-- Confirm Sheet -->
    <div class="sheet-overlay hidden" id="confirmOverlay"></div>
    <div class="sheet hidden" id="confirmSheet">
        <div class="sheet-handle"></div>
        <h3 class="sheet-title" id="confirmTitle">确认</h3>
        <div class="sheet-body">
            <p class="sheet-text" id="confirmText"></p>
            <div class="sheet-buttons">
                <button class="sheet-btn secondary" id="confirmCancel">取消</button>
                <button class="sheet-btn primary" id="confirmOk">好</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
